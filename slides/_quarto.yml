project:
  type: default
  output-dir: _site
  render:
    - index.qmd

format:
  revealjs:
    theme: simple
    width: 1280
    height: 720
    margin: 0.08
    center: false
    slide-level: 2
    slide-number: c/t
    transition: none
    incremental: false
    navigation-mode: linear
    history: true
    footer: '[John Lee · CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
